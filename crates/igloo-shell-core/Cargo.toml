[package]
name = "igloo-shell-core"
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Christopher Scott"]

[dependencies]
anyhow = "1"
futures-util = "0.3"
hex = "0.4"
k256 = { version = "0.13", features = ["schnorr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
nostr = { version = "0.44", features = ["std"] }
bifrost-app = { path = "../../../bifrost-rs/crates/bifrost-app" }
bifrost-profile = { path = "../../../bifrost-rs/crates/bifrost-profile" }
bifrost-codec = { path = "../../../bifrost-rs/crates/bifrost-codec" }
bifrost-core = { path = "../../../bifrost-rs/crates/bifrost-core" }
bifrost-signer = { path = "../../../bifrost-rs/crates/bifrost-signer" }
frostr-utils = { path = "../../../bifrost-rs/crates/frostr-utils" }
rand_core = "0.6"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
bincode = "1"
